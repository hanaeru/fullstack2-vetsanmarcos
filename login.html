<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

    <main class="auth-shell">
        <section class="auth-box">
            <img class="auth-logo" src="assets/logo-san-marcos.png" alt="Veterinaria San Marcos">
            <h1>Iniciar sesión</h1>

            <!-- El login es una simulación porque el proyecto no tiene backend. -->
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input id="email" type="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password">
                </div>

                <div class="form-group">
                    <label for="role">Rol</label>
                    <select id="role">
                        <option value="">Selecciona un rol</option>
                        <option value="admin">Administrador</option>
                        <option value="recepcion">Recepcionista</option>
                        <option value="veterinario">Médico veterinario</option>
                        <option value="tecnico">Técnico veterinario</option>
                        <option value="cliente">Dueño de mascota</option>
                    </select>
                </div>

                <button class="btn btn-primary auth-button" type="submit">Ingresar</button>
                <p id="login-message" class="form-message"></p>
            </form>

            <p class="auth-extra">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
            <p><a class="auth-back" href="index.html">Volver al inicio</a></p>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>

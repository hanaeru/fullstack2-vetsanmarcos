<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

    <main class="auth-shell">
        <section class="auth-box">
            <img class="auth-logo" src="assets/logo-san-marcos.png" alt="Veterinaria San Marcos">
            <h1>Crear cuenta</h1>

            <!-- Registro de ejemplo. No crea un usuario real. -->
            <form id="registro-form">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" type="text">
                </div>

                <div class="form-group">
                    <label for="email">Correo</label>
                    <input id="email" type="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password">
                </div>

                <div class="form-group">
                    <label for="password2">Repetir contraseña</label>
                    <input id="password2" type="password">
                </div>

                <button class="btn btn-primary auth-button" type="submit">Registrarse</button>
                <p id="registro-message" class="form-message"></p>
            </form>

            <p class="auth-extra">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
            <p><a class="auth-back" href="index.html">Volver al inicio</a></p>
        </section>
    </main>

    <script src="js/registro.js"></script>
</body>
</html>
